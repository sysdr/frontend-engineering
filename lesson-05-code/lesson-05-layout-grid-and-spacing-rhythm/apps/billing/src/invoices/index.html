<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse Billing: invoices</title>
    <script>
      try {
        const c = localStorage.getItem("pulse:theme");
        const dark = c === "dark" || ((c === null || c === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "@pulse/design-system": "/packages/design-system/src/index.js",
          "@pulse/design-system/": "/packages/design-system/src/",
          "@pulse/utils": "/packages/utils/src/index.js"
        }
      }
    </script>
    <link rel="stylesheet" href="/packages/design-system/src/base.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand pulse-cluster-1" href="/billing/invoices/"><span class="pulse-text-subheading">Pulse Billing</span></a>
      <nav class="pulse-cluster-2 pulse-text-caption" aria-label="Apps"><a href="/">Control Tower</a></nav>
      <div data-overlay-slot></div>
      <div data-theme-slot></div>
    </header>
    <main class="page pulse-stack-3">
      <header class="pulse-stack-1">
        <h1 class="pulse-text-title">Invoices</h1>
        <p class="pulse-text-caption pulse-muted" data-totals></p>
      </header>
      <section class="sheet" aria-label="Invoice list">
        <div class="table-wrap">
          <table class="pulse-table invoices">
            <thead>
              <tr>
                <th scope="col">Invoice</th>
                <th scope="col">Customer</th>
                <th scope="col">Issued</th>
                <th scope="col" aria-sort="ascending"><button type="button" class="sort" data-sort="due">Due</button></th>
                <th scope="col" class="num" aria-sort="none"><button type="button" class="sort" data-sort="amount">Amount</button></th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody data-rows></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
